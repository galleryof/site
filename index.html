<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>в разработке</title>
<style>
@import url('https://googleapis.com');
html,body{margin:0;padding:0;background:#09090b;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow:hidden;}
.main-container{width:100%;height:100vh;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box;padding:0 10%;background:#09090b;}
.left-side{flex:1;max-width:55%;}
.title-text{font-family:'Cinzel',serif;font-size:72px;font-weight:400;letter-spacing:4px;line-height:1.2;color:#ffffff;text-transform:uppercase;text-shadow:0 20px 50px rgba(0,0,0,0.5);}
.right-side{flex:1;display:flex;justify-content:flex-end;align-items:center;}
.meme-frame{width:450px;height:450px;border-radius:24px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.05);background:#121214;}
.meme-frame img{width:100%;height:100%;object-fit:cover;}
@media(max-width:900px){
.main-container{flex-direction:column;justify-content:center;padding:40px 20px;gap:50px;}
.left-side{max-width:100%;text-align:center;}
.title-text{font-size:42px;letter-spacing:2px;}
.right-side{justify-content:center;width:100%;}
.meme-frame{width:280px;height:280px;}
}
</style>
</head>
<body>
<div class="main-container">
<div class="left-side">
<div class="title-text">Сайт в разработке.</div>
</div>
<div class="right-side">
<div class="meme-frame">
<img id="random-meme" src="" alt="">
</div>
</div>
</div>
<script>
const memes=['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg'];
const randomMeme=memes[Math.floor(Math.random()*memes.length)];
document.getElementById('random-meme').src=randomMeme;
</script>
</body>
</html>
