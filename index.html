<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>галерея имени — #1 мемный канал</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1a1a24 0%, #0d0d11 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .landing-card {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .avatar-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 30%, #a3a3c2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            line-height: 1.1;
            background: linear-gradient(135deg, #ff5252, #ff7a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.2);
        }

        .disclaimer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .tg-button {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, #2481cc 0%, #0056b3 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(36, 129, 204, 0.3);
        }

        .tg-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(36, 129, 204, 0.5);
            background: linear-gradient(135deg, #2a96e6 0%, #0066d6 100%);
        }

        .tg-button:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="landing-card">
     
        <div class="avatar-container">
            <img src="ava.jpg" alt="ava">
        </div>

        <h1>галерея имени –</h1>
        <div class="subtitle">#1 мемный канал*</div>
        
        <div class="disclaimer">
            *по версии МИИ (мемного института имени) за 2025-2026 г.
        </div>

      
        <a href="https://t.me/galanrel" target="_blank" class="tg-button">Подписаться на канал -></a>

    </div>

</body>
</html>
